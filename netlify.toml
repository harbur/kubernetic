# Interim: the site still deploys on Netlify until the kubernetic-apps (Flux)
# manifest for the ghcr.io image is in place. Netlify runs the Next.js app
# through its Next.js runtime; the 308s for old /page.html URLs live in
# next.config.mjs.
[build]
  command = "bun run build"
  publish = ".next"
