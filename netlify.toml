# Interim: the site deploys on Netlify as a static export until the
# kubernetic-apps (Flux) manifest for the ghcr.io image is in place.
# Pages are written as /page.html, so old VuePress URLs keep resolving and
# Netlify serves /page from the same file.
[build]
  command = "NEXT_OUTPUT=export bun run build"
  publish = "out"

# "Generic" features moved from crosssections-features to general.
[[redirects]]
  from = "/features/crosssections-features/*"
  to = "/features/general/:splat"
  status = 301
